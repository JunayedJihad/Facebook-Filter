<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      width: 300px;
      padding: 12px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: #0866ff;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    h1 {
      margin: 0 0 16px 0;
      font-size: 18px;
      color: #0866ff;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    h1 img {
      width: 24px;
      height: 24px;
    }

    .option {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }

    .option:not(:last-of-type) {
      border-bottom: 1px solid #f0f0f0;
    }

    .option-label {
      font-size: 13px;
      color: #444;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .option-icon {
      font-size: 16px;
      width: 20px;
      text-align: center;
      color: #0866ff;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      background: #ccc;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s;
      flex-shrink: 0;
    }

    .toggle.active {
      background: #0866ff;
    }

    .toggle-circle {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: left 0.3s;
    }

    .toggle.active .toggle-circle {
      left: 22px;
    }

    .status {
      margin-top: 12px;
      padding: 8px;
      background: #e7f3ff;
      border: 1px solid #0866ff;
      border-radius: 6px;
      text-align: center;
      font-size: 12px;
      color: #0866ff;
      display: none;
    }

    .status.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><img src="icon.png" alt="Icon"> Facebook Content Filter</h1>

    <div class="status" id="status">Settings saved!</div>

    <div class="option">
      <span class="option-label">
        <i class="fas fa-clock option-icon"></i>
        Time Tracker
      </span>
      <div class="toggle" data-option="showTimer">
        <div class="toggle-circle"></div>
      </div>
    </div>

    <div class="option">
      <span class="option-label">
        <i class="fas fa-palette option-icon"></i>
        Grayscale Mode
      </span>
      <div class="toggle" data-option="grayscale">
        <div class="toggle-circle"></div>
      </div>
    </div>

    <div class="option">
      <span class="option-label">
        <i class="fas fa-film option-icon"></i>
        Hide Reels
      </span>
      <div class="toggle" data-option="reels">
        <div class="toggle-circle"></div>
      </div>
    </div>

    <div class="option">
      <span class="option-label">
        <i class="fas fa-book option-icon"></i>
        Hide Stories
      </span>
      <div class="toggle" data-option="stories">
        <div class="toggle-circle"></div>
      </div>
    </div>

    <div class="option">
      <span class="option-label">
        <i class="fas fa-ad option-icon"></i>
        Hide Sponsored
      </span>
      <div class="toggle" data-option="sponsored">
        <div class="toggle-circle"></div>
      </div>
    </div>

    <div class="option">
      <span class="option-label">
        <i class="fas fa-store option-icon"></i>
        Hide Marketplace
      </span>
      <div class="toggle" data-option="marketplace">
        <div class="toggle-circle"></div>
      </div>
    </div>

    <div class="option">
      <span class="option-label">
        <i class="fas fa-tv option-icon"></i>
        Hide Watch
      </span>
      <div class="toggle" data-option="watch">
        <div class="toggle-circle"></div>
      </div>
    </div>

    <div class="option">
      <span class="option-label">
        <i class="fas fa-gamepad option-icon"></i>
        Hide Gaming
      </span>
      <div class="toggle" data-option="games">
        <div class="toggle-circle"></div>
      </div>
    </div>

    <div class="option">
      <span class="option-label">
        <i class="fas fa-magic option-icon"></i>
        Hide Suggested
      </span>
      <div class="toggle" data-option="suggested">
        <div class="toggle-circle"></div>
      </div>
    </div>

    <div class="option" style="border-bottom: none !important;">
      <span class="option-label">
        <i class="fas fa-user-friends option-icon"></i>
        Hide People You May Know
      </span>
      <div class="toggle" data-option="peopleYouMayKnow">
        <div class="toggle-circle"></div>
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
